# Novgorod at @PREFIX@/ on every Apache site (install.sh fills in @...@).
# Needs mod_proxy and mod_proxy_http. Apache strips @PREFIX@ on the way in;
# Novgorod (--prefix @PREFIX@) writes it into its links and redirects.
RedirectMatch 301 "^@PREFIX@$" "@PREFIX@/"
<Location "@PREFIX@/">
    ProxyPass "http://127.0.0.1:@PORT@/" timeout=120
    ProxyPassReverse "http://127.0.0.1:@PORT@/"
    # Novgorod compares a post's Origin with Host
    ProxyPreserveHost On
    # images arrive base64-encoded, up to about 2.6 MB a post
    LimitRequestBody 3000000
</Location>
