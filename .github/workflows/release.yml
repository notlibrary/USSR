name: Release USSR

on:
  push:
    tags:
      - "*"

env:
  APP_NAME: ussr-win-bin-amd64
  # The GLFW release the Windows build links and ships (same as ci.yml)
  GLFW_VERSION: 3.5.1

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: softprops/action-gh-release@v2
        id: create
        with:
          tag_name: ${{ github.ref_name }}
          name: USSR
          draft: false
          prerelease: false
          body: Unified Shell Script REPL
          token: ${{ secrets.PAT8 }}

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      # Test sources and expectations are LF; keep them that way (as ci.yml).
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flex and Bison
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install winflexbison3 --no-progress -y
          echo "C:\\Program Files\\winflexbison3" >> $env:GITHUB_PATH

      - name: Initialize MSVC Environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install WiX
        if: runner.os == 'Windows'
        run: dotnet tool install --global wix --version 7.0.0

      - name: Build Ural and install GLFW for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = 'C:\vcpkg' }
          & "$vcpkgRoot\vcpkg.exe" install 'sqlite3' 'curl[openssl]' 'openssl' 'zlib' --triplet x64-windows-static
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force build | Out-Null
          $glfwArchive = Join-Path $PWD "build\glfw-$env:GLFW_VERSION.bin.WIN64.zip"
          Invoke-WebRequest "https://github.com/glfw/glfw/releases/download/$env:GLFW_VERSION/glfw-$env:GLFW_VERSION.bin.WIN64.zip" -OutFile $glfwArchive
          Expand-Archive $glfwArchive -DestinationPath build\glfw -Force
          
          cmake -S src/ural -B build/ural `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DURAL_STATIC_DEPS=ON -DBUILD_TESTING=OFF
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/ural --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          $ural = Join-Path $PWD 'build\ural\Release\ural.exe'
          if (-not (Test-Path $ural)) { throw "Ural executable not found at $ural" }
          $env:LOCALAPPDATA = Join-Path $PWD 'build\ural-state'
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA | Out-Null
          & $ural init
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item $ural .\ural.exe -Force
          Copy-Item (Join-Path $env:LOCALAPPDATA 'USSR\ussr.boxes') .\ussr.boxes -Force

      - name: Build on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          win_bison -d -o src\parser.tab.c src\parser.y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          win_flex -o src\lexer.c src\lexer.l
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Links glfw3dll.lib (Makefile.msc's default with GLFW_DIR); the
          # matching glfw3.dll ships next to ussr.exe.
          $glfwRoot = Join-Path $PWD "build\glfw\glfw-$env:GLFW_VERSION.bin.WIN64"
          nmake /nologo /f Makefile.msc PREGENERATED=1 GLFW_DIR=$glfwRoot ussr.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $glfwDll = Join-Path $glfwRoot 'lib-vc2022\glfw3.dll'
          if (-not (Test-Path $glfwDll)) { throw "GLFW runtime DLL not found at $glfwDll" }
          Copy-Item $glfwDll .\glfw3.dll -Force

      - name: Test on Windows (without GUI)
        if: runner.os == 'Windows'
        shell: bash
        env:
          USSR_SKIP_GUI: "1"
        run: sh tests/run_all.sh --native ./ussr.exe

      - name: Package for Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force ussr-win-bin
          Copy-Item ussr.exe ussr-win-bin\ -Force
          Copy-Item glfw3.dll ussr-win-bin\ -Force
          Copy-Item ural.exe ussr-win-bin\ -Force
          Copy-Item src\ural\ural.su ussr-win-bin\ -Force
          Copy-Item ussr.boxes ussr-win-bin\ -Force
          Copy-Item README.md, CHANGELOG.md, LICENSE ussr-win-bin\ -ErrorAction SilentlyContinue
          Compress-Archive -Path ussr-win-bin\* -DestinationPath ussr-win-bin-amd64-${{ github.ref_name }}.zip -Force
          wix build -acceptEula wix7 ussr.wxs -arch x64 -out ussr-win-bin-amd64-${{ github.ref_name }}.msi 
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload to Release Win
        if: runner.os == 'Windows'       
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT8 }}
          files: |
            ussr-win-bin-amd64-${{ github.ref_name }}.msi
            ussr-win-bin-amd64-${{ github.ref_name }}.zip

      - name: Install Flex, Bison and build tools
        if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison autoconf automake libtool \
            cmake pkg-config libsqlite3-dev libcurl4-openssl-dev libssl-dev zlib1g-dev \
            libglfw3-dev libgl1-mesa-dev

      - name: Build and test Ural
        if: runner.os != 'Windows'
        run: |
          cmake -S src/ural -B build/ural -DURAL_STATIC_DEPS=OFF
          cmake --build build/ural --parallel
          ctest --test-dir build/ural --output-on-failure

      # ussr-ubuntu.mk runs bison and flex itself; PETERSBURG_BUNDLE=1 fails
      # without GLFW and ships libglfw.so.3 in lib/ next to ussr.
      - name: Build on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: make -f ussr-ubuntu.mk -j"$(nproc)" PETERSBURG_BUNDLE=1 RYAZAN_REQUIRE_TLS=1 ussr

      - name: Test on Linux (without GUI)
        if: runner.os != 'Windows'
        shell: bash
        env:
          USSR_SKIP_GUI: "1"
        run: sh tests/run_all.sh --native ./ussr

      - name: Package for Linux
        if: runner.os != 'Windows'
        shell: bash
        run: make -f ussr-ubuntu.mk PETERSBURG_BUNDLE=1 dist VERSION=${{ github.ref_name }}

      - name: Upload to Release Linux
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT8 }}
          files: ussr-linux-bin-${{ github.ref_name }}.tar.gz

      - name: Reconfigure build env
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # objects of the ussr-ubuntu.mk build share names with automake's
          rm -f ussr src/*.o src/parser.tab.c src/parser.tab.h src/lex.yy.c
          autoreconf -ivf
          ./configure --enable-petersburg
          make -j"$(nproc)"
          # distcheck builds the tarball's own sources: a file missing from
          # EXTRA_DIST fails the release instead of the people building it
          make distcheck
          version=$(awk -F'[][]' '/^AC_INIT/ { print $4; exit }' configure.ac)
          mv "ussr-$version.tar.gz" ussr-unix-tarball-amd64-${{ github.ref_name }}.tar.gz

      - name: Upload Unix tarball to Release
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.PAT8 }}
          files: ussr-unix-tarball-amd64-${{ github.ref_name }}.tar.gz

      - name: Extract Release Notes
        if: runner.os != 'Windows'
        id: parse_changelog
        uses: ffurrer2/extract-release-notes@v3.1.0
        with:
          changelog_file: CHANGELOG.md

      - name: Update Existing GitHub Release
        if: runner.os != 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.parse_changelog.outputs.release_notes }}
          token: ${{ secrets.PAT8 }}
