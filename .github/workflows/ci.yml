name: CI

# The quick check for every pull request and push to main: one Linux job,
# a debug build (no optimisation, so it compiles fast) and
# tests/run_default.sh, the main suites with the ussr binary only.
#
# Everything else runs in release.yml when a tag is pushed: release builds
# on Linux and Windows, tests/run_all.sh with the russia.su parity pass,
# the GUI tests and the Ryazan TLS loopback. Run that set by hand with
# "sh tests/run_all.sh" before tagging.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (gcc debug, default tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison

      - name: Build (debug)
        run: make -f ussr-ubuntu.mk -j"$(nproc)" DEBUG=1 ussr

      - name: Test (default set)
        run: sh tests/run_default.sh ./ussr
